name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install ruff pytest httpx fastapi python-multipart pydantic onnxruntime Pillow numpy huggingface_hub

      - name: Lint
        run: ruff check app/

      - name: Test
        run: pytest tests/ -v
